name: Alpha Release

on:
  push:
    branches:
      - singbox-tools
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish alpha release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        run: pnpm build

      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag="v${version}-alpha.${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          tar -czf "zashboard-${tag}.tar.gz" -C dist .

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: zashboard ${{ steps.metadata.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          body: |
            Automated alpha release for commit `${{ github.sha }}`.
          files: zashboard-${{ steps.metadata.outputs.tag }}.tar.gz
